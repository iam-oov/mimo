services:
  postgres:
    image: postgres:16-alpine
    container_name: mimo-postgres
    environment:
      POSTGRES_DB: mimo
      POSTGRES_USER: mimo
      POSTGRES_PASSWORD: mimo_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimo -d mimo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mimo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mimo-app
    ports:
      - "8000:8000"
    environment:
      # Database
      - DATABASE_URL=postgresql://mimo:mimo_local_dev@postgres:5432/mimo

      # OAuth (required for AI recommendations)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}

      # Session security
      - SECRET_KEY=${SECRET_KEY}

      # AI Providers
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      # Optional settings
      - DAILY_RECOMMENDATIONS_LIMIT=${DAILY_RECOMMENDATIONS_LIMIT:-3}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
    driver: local
