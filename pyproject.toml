[project]
name = "mimo"
version = "0.1.0"
description = "Calculadora de Saldo a Favor - Declaración Anual"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.0",
    "packaging>=25.0",
    "python-dotenv>=1.2.1",
    "fastapi>=0.120.1",
    "uvicorn>=0.38.0",
    "itsdangerous>=2.2.0",
    "python-jose[cryptography]>=3.5.0",
    "google-auth>=2.41.1",
    "google-auth-oauthlib>=1.2.2",
    "requests>=2.32.5",
    "python-dateutil>=2.9.0.post0",
    "google-auth-httplib2>=0.2.0",
    "pydantic-settings>=2.0.0",
    "sse-starlette>=2.0.0",
    "openai>=2.7.1",
    "litellm>=1.50.0",
    "prometheus-client>=0.20.0",
    "google-genai>=1.55.0",
]

[tool.pyright]
reportUnknownParameterType = "none" # o "warning" en lugar de "error"

[project.optional-dependencies]
pdf = ["weasyprint>=62.0"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]
